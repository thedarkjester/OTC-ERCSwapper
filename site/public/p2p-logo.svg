<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" width="120" height="40">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="20" cy="20" r="18" fill="url(#gradient)" opacity="0.1"/>
  
  <!-- P2P Text -->
  <text 
    x="20" 
    y="28" 
    font-family="Arial, sans-serif" 
    font-size="20" 
    font-weight="bold" 
    fill="url(#gradient)" 
    text-anchor="middle"
    letter-spacing="2"
  >P2P</text>
  
  <!-- Decorative lines -->
  <line x1="45" y1="15" x2="55" y2="15" stroke="url(#gradient)" stroke-width="2" stroke-linecap="round"/>
  <line x1="45" y1="20" x2="55" y2="20" stroke="url(#gradient)" stroke-width="2" stroke-linecap="round"/>
  <line x1="45" y1="25" x2="55" y2="25" stroke="url(#gradient)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Swap arrows -->
  <path d="M 60 20 L 70 15 L 70 18 L 85 18 L 85 22 L 70 22 L 70 25 Z" fill="url(#gradient)"/>
  <path d="M 85 20 L 75 15 L 75 18 L 60 18 L 60 22 L 75 22 L 75 25 Z" fill="url(#gradient)"/>
</svg>

